[project]
name = "jevtests"
version = "0.1.0"
description = "Reproducible benchmark lab: TypeSafe Jev vs local/open System-One decision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "adapters", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
